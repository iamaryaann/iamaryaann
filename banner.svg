<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="900" height="240">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.92"/>
    </linearGradient>
    <radialGradient id="glowCyan" cx="15%" cy="20%" r="45%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowOrange" cx="88%" cy="80%" r="45%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#334155" stroke-width="0.6" stroke-opacity="0.35"/>
    </pattern>
  </defs>

  <!-- Base Container -->
  <rect width="900" height="240" rx="18" fill="url(#bgGrad)"/>
  <rect width="900" height="240" rx="18" fill="url(#grid)"/>
  <rect width="900" height="240" rx="18" fill="url(#glowCyan)"/>
  <rect width="900" height="240" rx="18" fill="url(#glowOrange)"/>
  <rect x="1" y="1" width="898" height="238" rx="17" fill="none" stroke="#334155" stroke-width="1.5" stroke-opacity="0.7"/>

  <!-- Top Accent Line -->
  <rect x="44" y="0" width="200" height="3" rx="1.5" fill="url(#accentGrad)"/>

  <!-- Live Status Pill -->
  <rect x="44" y="34" width="278" height="28" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <circle cx="61" cy="48" r="4.5" fill="#10b981">
    <animate attributeName="opacity" values="1;0.35;1" dur="2.2s" repeatCount="indefinite"/>
  </circle>
  <text x="75" y="52" fill="#cbd5e1" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" letter-spacing="0.6">OPEN TO INTERNSHIPS &amp; PROJECTS</text>

  <!-- Main Heading -->
  <text x="44" y="114" fill="#f8fafc" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="40" font-weight="800" letter-spacing="-0.5">Aryan Khan</text>

  <!-- Gradient Role Subtitle -->
  <text x="44" y="148" fill="url(#accentGrad)" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="17.5" font-weight="700">AI &amp; Data Science Student  •  Web Developer</text>

  <!-- University & Location -->
  <text x="44" y="182" fill="#94a3b8" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="500">Lovely Professional University (LPU)  •  Building Data-Driven &amp; Interactive Web Apps</text>

  <!-- Right Side Code Window Card -->
  <g transform="translate(555, 36)">
    <rect width="305" height="168" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2"/>
    <!-- Window Dots -->
    <circle cx="20" cy="18" r="4.5" fill="#ef4444"/>
    <circle cx="35" cy="18" r="4.5" fill="#f59e0b"/>
    <circle cx="50" cy="18" r="4.5" fill="#10b981"/>
    <text x="115" y="22" fill="#64748b" font-family="Consolas, 'Fira Code', monospace" font-size="11">aryan.config.js</text>
    <line x1="0" y1="34" x2="305" y2="34" stroke="#334155" stroke-width="1"/>

    <!-- Code Lines -->
    <text x="18" y="58" font-family="Consolas, 'Fira Code', monospace" font-size="12">
      <tspan fill="#c084fc">const</tspan> <tspan fill="#38bdf8">developer</tspan> <tspan fill="#e2e8f0">=</tspan> <tspan fill="#facc15">{</tspan>
    </text>
    <text x="32" y="80" font-family="Consolas, 'Fira Code', monospace" font-size="12">
      <tspan fill="#94a3b8">handle:</tspan> <tspan fill="#4ade80">"@iamaryaann"</tspan><tspan fill="#e2e8f0">,</tspan>
    </text>
    <text x="32" y="102" font-family="Consolas, 'Fira Code', monospace" font-size="12">
      <tspan fill="#94a3b8">domain:</tspan> <tspan fill="#fb923c">"AI &amp; Data Science"</tspan><tspan fill="#e2e8f0">,</tspan>
    </text>
    <text x="32" y="124" font-family="Consolas, 'Fira Code', monospace" font-size="12">
      <tspan fill="#94a3b8">web:</tspan> <tspan fill="#38bdf8">["JS", "Tailwind", "PWA"]</tspan>
    </text>
    <text x="18" y="146" font-family="Consolas, 'Fira Code', monospace" font-size="12">
      <tspan fill="#facc15">}</tspan><tspan fill="#e2e8f0">;</tspan>
    </text>
  </g>
</svg>